spring.application.name=appointment-service
server.port=8082

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=appointment_db;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=${SQLSERVER_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Dia chi cac Microservices (Lab 03 - RestClient)
services.doctor.url=http://localhost:8083
services.patient.url=http://localhost:8081

# Aliases
doctor.service.url=${services.doctor.url}
patient.service.url=${services.patient.url}
